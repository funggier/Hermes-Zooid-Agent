name: HermesZooid Identity

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "hermeszooid/**"
      - "zooid_cnx/**"
      - "tests/zooid_cnx/test_hermeszooid_identity.py"
      - ".github/workflows/hermeszooid-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermeszooid-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity-contract:
    name: Package CLI home and lock identity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Verify lock identity
        run: uv lock --check

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 pyyaml==6.0.3

      - name: Run HermesZooid identity contract
        run: >-
          python -m pytest
          --confcutdir=tests/zooid_cnx
          tests/zooid_cnx/test_hermeszooid_identity.py
          -q
