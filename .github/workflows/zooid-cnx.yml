name: Zooid CogentNexus Kernel

on:
  pull_request:
    paths:
      - "zooid_cnx/**"
      - "tests/zooid_cnx/**"
      - "zooid-development/**"
      - ".github/workflows/zooid-cnx.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zooid-cnx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel-contract:
    name: CogentNexus runtime contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install pinned contract dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==9.1.1
          pyyaml==6.0.3

      - name: Run isolated CogentNexus contracts
        run: >-
          python -m pytest
          --confcutdir=tests/zooid_cnx
          tests/zooid_cnx
          -q
