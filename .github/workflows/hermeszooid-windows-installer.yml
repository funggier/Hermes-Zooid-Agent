name: HermesZooid Windows Installer Identity

on:
  pull_request:
    paths:
      - "scripts/install.ps1"
      - "tests/hermeszooid/**"
      - ".github/workflows/hermeszooid-windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermeszooid-windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    name: Installer ownership static contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Run static installer ownership contract
        run: python -m pytest tests/hermeszooid/test_windows_installer_contract.py -q

  windows-resolved-paths:
    name: Windows resolved paths contract
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Windows installer identity contract
        shell: pwsh
        run: ./tests/hermeszooid/test_windows_installer_identity.ps1
